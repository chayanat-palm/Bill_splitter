<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bill Splitter V1.0.1</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --primary: #0071e3; --text: #1d1d1f; --bg: #f5f5f7; --card-bg: #ffffff; --success: #34c759; }
        body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); padding: 20px; margin: 0; min-height: 100vh; display: flex; flex-direction: column; }
        .container { max-width: 450px; margin: auto; flex: 1; }
        h2 { font-weight: 600; font-size: 24px; margin-bottom: 25px; text-align: center; color: var(--primary); }
        h2 i { margin-right: 10px; }
        footer { text-align: center; font-size: 12px; color: #86868b; margin-top: 20px; padding-bottom: 20px; }
        
        .section { background: var(--card-bg); padding: 16px; border-radius: 12px; margin-bottom: 16px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .row { display: flex; gap: 10px; margin-bottom: 10px; align-items: center; }
        .input-group { position: relative; flex: 1; }
        .input-group i { position: absolute; left: 12px; top: 50%; transform: translateY(-50%); color: #86868b; font-size: 14px; }
        .input-group input { padding-left: 35px; }
        
        input { border: 1px solid #d2d2d7; border-radius: 8px; padding: 12px; font-size: 15px; width: 100%; box-sizing: border-box; outline: none; transition: 0.2s; }
        input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.1); }
        .label-sm { font-size: 12px; font-weight: 600; color: #86868b; margin-bottom: 8px; display: flex; align-items: center; gap: 5px; }
        
        .checkbox-group { display: flex; gap: 20px; margin-bottom: 5px; justify-content: center; }
        .checkbox-item { font-size: 14px; display: flex; align-items: center; gap: 8px; cursor: pointer; padding: 8px 12px; border-radius: 8px; background: #f5f5f7; transition: 0.2s; }
        .checkbox-item:hover { background: #e8e8ed; }
        
        .btn { border: none; border-radius: 8px; padding: 12px; font-weight: 600; cursor: pointer; width: 100%; font-size: 14px; transition: 0.2s; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-add { background: #f5f5f7; color: var(--primary); margin-top: 5px; border: 1px dashed #d2d2d7; }
        .btn-add:hover { background: #e8e8ed; border-color: var(--primary); }
        .btn-copy { background: var(--success); color: white; margin-bottom: 15px; }
        .btn-copy:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-reset { background: transparent; color: #ff3b30; margin-top: 15px; font-size: 12px; opacity: 0.7; }
        .btn-reset:hover { opacity: 1; }

        .result-item { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid #f5f5f7; }
        .result-item:last-child { border-bottom: none; }
        .price-final { font-weight: 600; font-size: 16px; color: var(--text); }
        .price-exact { font-size: 11px; color: #86868b; display: block; text-align: right; }

        .summary-box { background: #1d1d1f; color: #fff; border-radius: 12px; padding: 20px; margin-top: 20px; }
        .summary-row { display: flex; justify-content: space-between; margin-bottom: 8px; align-items: center; }
        .summary-row.total { border-top: 1px solid #333; padding-top: 15px; margin-top: 15px; font-size: 24px; font-weight: 700; color: #40ffaa; }
        .summary-label { font-size: 13px; opacity: 0.7; display: flex; align-items: center; gap: 6px; }
    </style>
</head>
<body>

<div class="container">
    <h2><i class="fa-solid fa-receipt"></i> Bill Splitter V1.0.1</h2>

    <div class="section">
        <div class="checkbox-group">
            <label class="checkbox-item"><input type="checkbox" id="svcCheck" onchange="update()"> <i class="fa-solid fa-bell-concierge"></i> SVC 10%</label>
            <label class="checkbox-item"><input type="checkbox" id="vatCheck" onchange="update()"> <i class="fa-solid fa-file-invoice"></i> VAT 7%</label>
        </div>
    </div>

    <div class="section">
        <span class="label-sm"><i class="fa-solid fa-utensils"></i> รายการอาหาร (ใส่ + - ได้)</span>
        <div id="itemContainer" oninput="update()">
            <div class="row">
                <div class="input-group" style="flex: 1.5;">
                    <i class="fa-solid fa-user"></i>
                    <input type="text" placeholder="ชื่อ" class="name-in">
                </div>
                <div class="input-group" style="flex: 1;">
                    <i class="fa-solid fa-baht-sign"></i>
                    <input type="text" placeholder="ราคา" class="price-in">
                </div>
            </div>
        </div>
        <button class="btn btn-add" onclick="addItem()"><i class="fa-solid fa-plus"></i> เพิ่มรายการ</button>
    </div>

    <div class="section" oninput="update()">
        <div class="row">
            <div style="flex:1">
                <span class="label-sm"><i class="fa-solid fa-truck"></i> ค่าส่ง/อื่นๆ</span>
                <div class="input-group">
                    <i class="fa-solid fa-baht-sign"></i>
                    <input type="text" id="extraFee" value="">
                </div>
            </div>
            <div style="flex:1">
                <span class="label-sm"><i class="fa-solid fa-tag"></i> ส่วนลดรวม</span>
                <div class="input-group">
                    <i class="fa-solid fa-baht-sign"></i>
                    <input type="text" id="totalDiscount" value="">
                </div>
            </div>
        </div>
    </div>

    <div class="section" id="individualResults" style="display:none;">
        <button id="copyBtn" class="btn btn-copy" onclick="copyToClipboard()"><i class="fa-solid fa-copy"></i> คัดลอกสรุปยอด (LINE)</button>
        <div id="resultList"></div>
    </div>

    <div class="summary-box">
        <div class="summary-row">
            <span class="summary-label"><i class="fa-solid fa-calculator"></i> ยอดรวมในแอป (ก่อนปัด)</span>
            <span id="totalExact">0.00</span>
        </div>
        <div class="summary-row total">
            <span class="summary-label" style="color: #fff;"><i class="fa-solid fa-wallet"></i> ยอดเก็บจริง</span>
            <span id="totalRounded">0</span>
        </div>
    </div>

    <button class="btn btn-reset" onclick="resetForm()"><i class="fa-solid fa-trash-can"></i> ล้างข้อมูล</button>
</div>

<footer>Version 1.0.1</footer>

<script src="js/script.js"></script>

</body>
</html>
